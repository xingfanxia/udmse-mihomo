name: Scoped checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Shell and boundary checks
        run: |
          shellcheck ./*.sh
          python3 -m unittest discover -s tests -p '*_test.py' -v
