# Private template. install.sh safely renders the subscription and API secret.
# The routing guard must be in place before the service starts.
mixed-port: 7890
tproxy-port: 7893
allow-lan: false
bind-address: 127.0.0.1
mode: rule
log-level: warning
ipv6: false
external-controller: 127.0.0.1:9090
secret: "GENERATED_API_SECRET_HERE"

# Keep the router's existing port 53 resolver untouched. Runtime redirects only
# the explicitly selected IPv4 sources and blocks other access to port 1053.
dns:
  enable: true
  listen: "GENERATED_DNS_LISTEN_HERE"
  ipv6: false
  enhanced-mode: redir-host
  default-nameserver:
    - 223.5.5.5
    - 119.29.29.29
  nameserver:
    - "https://1.1.1.1/dns-query#PROXY"
  nameserver-policy:
    "rule-set:cn-domain":
      - "https://dns.alidns.com/dns-query#DIRECT"
    "+.localdomain": ["127.0.0.1:53"]
    "+.lan": ["127.0.0.1:53"]
  proxy-server-nameserver:
    - "https://dns.alidns.com/dns-query#DIRECT"
  direct-nameserver:
    - "https://dns.alidns.com/dns-query#DIRECT"
  direct-nameserver-follow-policy: false

sniffer:
  enable: true
  force-dns-mapping: true
  parse-pure-ip: true
  sniff:
    HTTP:
      ports: [80, 8080-8880]
      override-destination: true
    TLS:
      ports: [443, 8443]
    QUIC:
      ports: [443, 8443]

proxy-providers:
  my-sub:
    type: http
    proxy: DIRECT
    url: "YOUR_CLASH_SUBSCRIPTION_URL_HERE"
    interval: 3600
    path: ./providers/my-sub.yaml
    health-check:
      enable: true
      interval: 300
      url: https://www.gstatic.com/generate_204

proxy-groups:
  - name: PROXY
    type: select
    empty-fallback: REJECT
    use: [my-sub]

# Only the two China rule sets are needed. No geosite.dat/geoip.dat/MMDB.
rule-providers:
  cn-domain:
    type: http
    proxy: DIRECT
    behavior: domain
    format: mrs
    url: https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/meta/geo/geosite/cn.mrs
    path: ./rules/cn-domain.mrs
    interval: 86400
  cn-ip:
    type: http
    proxy: DIRECT
    behavior: ipcidr
    format: mrs
    url: https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/meta/geo/geoip/cn.mrs
    path: ./rules/cn-ip.mrs
    interval: 86400

rules:
  - DOMAIN-SUFFIX,lan,DIRECT
  - DOMAIN-SUFFIX,local,DIRECT
  - IP-CIDR,0.0.0.0/8,DIRECT,no-resolve
  - IP-CIDR,10.0.0.0/8,DIRECT,no-resolve
  - IP-CIDR,100.64.0.0/10,DIRECT,no-resolve
  - IP-CIDR,127.0.0.0/8,DIRECT,no-resolve
  - IP-CIDR,169.254.0.0/16,DIRECT,no-resolve
  - IP-CIDR,172.16.0.0/12,DIRECT,no-resolve
  - IP-CIDR,192.168.0.0/16,DIRECT,no-resolve
  - IP-CIDR,224.0.0.0/4,DIRECT,no-resolve
  - IP-CIDR,240.0.0.0/4,DIRECT,no-resolve
  - RULE-SET,cn-domain,DIRECT
  - RULE-SET,cn-ip,DIRECT
  - MATCH,PROXY
